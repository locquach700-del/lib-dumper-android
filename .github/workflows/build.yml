name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android commandline tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle and build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew assembleDebug --stacktrace

      - name: List outputs
        if: always()
        run: find app/build -name '*.apk' 2>/dev/null || ls -la app/build 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibDumper-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
